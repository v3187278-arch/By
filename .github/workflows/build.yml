name: Build ArmColor

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ArmColor.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ArmColor
          path: bin/Release/net472/ArmColor.dll
          if-no-files-found: error
          
